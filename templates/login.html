<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="description" content="SpendWise: Track spending, income, and monthly cash flow in one focused budget calendar.">
    <title>SpendWise - Sign In</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-brand" aria-label="SpendWise">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="" class="brand-mark">
            <span class="brand-name">SpendWise</span>
        </div>
        <h1 id="form-title">Sign In</h1>
        <div id="error-msg" class="error-msg" style="display: none;"></div>
        
        <form id="auth-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="✉  Enter Username" required class="unified-input">
            </div>
            
            <div class="input-group">
                <label for="password" id="pass-label">Password</label>
                <input type="password" id="password" placeholder="🔒  Enter Password" required class="unified-input">
            </div>
            
            <button type="submit" id="submit-btn" class="btn-primary">SIGN IN</button>
        </form>
        
        <div class="switch-mode">
            <span id="switch-lbl">Don't have an account?</span>
            <button type="button" class="btn-text" id="switch-btn">Sign up</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
